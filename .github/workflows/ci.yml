name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 scripts/check-lang-ratio.py
